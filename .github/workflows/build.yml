name: Build umi kernel (KernelSU-Next)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: LineageOS kernel branch (must match the LineageOS version on the phone)
        default: lineage-23.2
        required: true
      ksu_ref:
        description: KernelSU-Next branch or tag (non-GKI 4.19 needs the legacy line)
        default: legacy
        required: true
      clang_version:
        description: AOSP prebuilt clang directory name
        default: clang-r547379
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_xiaomi_sm8250.git
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KSU_REF: ${{ inputs.ksu_ref }}
      CLANG_VERSION: ${{ inputs.clang_version }}
      OUT: ${{ github.workspace }}/out

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio zip python3 make git device-tree-compiler

      # googlesource builds the archive on the fly and can drop the stream, so download to a file and verify
      - name: Download AOSP clang (fallback to Ubuntu LLVM 18)
        run: |
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz"
          ok=0
          for i in 1 2 3 4 5; do
            rm -f clang.tgz
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 30 -sS -o clang.tgz "$URL" && gzip -t clang.tgz; then
              ok=1; break
            fi
            echo "::warning::AOSP clang download attempt $i failed"
            sleep 20
          done
          if [ "$ok" = 1 ]; then
            mkdir -p "$HOME/clang"
            tar -xzf clang.tgz -C "$HOME/clang"
            rm -f clang.tgz
            CLANG_BIN="$HOME/clang/bin"
          else
            echo "::warning::Falling back to Ubuntu LLVM 18 instead of AOSP ${CLANG_VERSION}"
            sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
            CLANG_BIN=/usr/lib/llvm-18/bin
          fi
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          "$CLANG_BIN/clang" --version
          "$CLANG_BIN/ld.lld" --version

      - name: Clone LineageOS kernel
        run: git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Integrate KernelSU-Next
        working-directory: kernel
        run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_REF}/kernel/setup.sh" | bash -s "$KSU_REF"
          git -C KernelSU-Next log -1 --format='KernelSU-Next %H (%cd)'

      # KernelSU-Next legacy assumes kernels < 5.8 lack copy_to_kernel_nofault and #defines it to
      # probe_kernel_write; LineageOS 4.19 already backports the real function, so the macro
      # rewrites the declaration in <linux/uaccess.h> and breaks the build.
      - name: Patch KernelSU-Next for backported nofault API
        working-directory: kernel
        run: |
          grep -q 'copy_to_kernel_nofault' include/linux/uaccess.h || { echo "kernel has no copy_to_kernel_nofault, nothing to patch"; exit 0; }
          python3 - <<'EOF'
          import re
          p = "KernelSU-Next/kernel/hook/patch_memory.c"
          s = open(p).read()
          n = re.sub(r'#if LINUX_VERSION_CODE < KERNEL_VERSION\(5, 8, 0\)\n#define copy_to_kernel_nofault\([^\n]*\\\n[^\n]*\n#endif\n', '', s, count=1)
          assert n != s, "copy_to_kernel_nofault macro block not found; upstream changed, review the patch"
          open(p, "w").write(n)
          print("removed copy_to_kernel_nofault compat macro")
          EOF
          ! grep -n 'define copy_to_kernel_nofault' KernelSU-Next/kernel/hook/patch_memory.c

      - name: Generate .config (same fragment order as LineageOS umi)
        working-directory: kernel
        run: |
          MAKE_FLAGS="ARCH=arm64 O=$OUT LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar \
            HOSTCC=clang HOSTCXX=clang++ HOSTLD=ld.lld HOSTAR=llvm-ar"
          echo "MAKE_FLAGS=$MAKE_FLAGS" >> "$GITHUB_ENV"
          mkdir -p "$OUT"
          cp arch/arm64/configs/vendor/kona-perf_defconfig "$OUT/.config"
          make $MAKE_FLAGS olddefconfig
          for frag in \
            arch/arm64/configs/vendor/debugfs.config \
            arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
            arch/arm64/configs/vendor/xiaomi/umi.config \
            "$GITHUB_WORKSPACE/ksu.config"; do
            scripts/kconfig/merge_config.sh -m -O "$OUT" "$OUT/.config" "$frag"
            make $MAKE_FLAGS olddefconfig
          done
          for opt in CONFIG_KSU=y CONFIG_KSU_SYSCALL_TABLE_HOOK=y CONFIG_KALLSYMS_ALL=y CONFIG_MACH_XIAOMI_UMI=y; do
            grep -qx "$opt" "$OUT/.config" || { echo "::error::$opt missing from final .config"; exit 1; }
          done
          grep -E '^CONFIG_KSU|KSU_MANUAL_HOOK' "$OUT/.config"

      # KernelSU-Next's Kbuild edits fs/namespace.c, fs/internal.h and include/linux/seccomp.h with
      # $(shell sed ...) while make parses drivers/kernelsu/Kbuild. A normal build reaches drivers/
      # after fs/ and kernel/ are already compiled, so those objects would miss the edits (undefined
      # path_umount, and struct seccomp layout mismatch). Building the KernelSU dir first applies them
      # up front; the full build below then rebuilds whatever depends on the edited files.
      - name: Pre-apply KernelSU-Next source backports
        working-directory: kernel
        run: |
          # KernelSU includes SELinux's generated flask.h, which a full build creates before drivers/
          make -j"$(nproc)" $MAKE_FLAGS security/selinux/ 2>&1 | tee "$OUT/prebuild.log"; test "${PIPESTATUS[0]}" -eq 0
          test -f "$OUT/security/selinux/flask.h" || { echo "::error::flask.h was not generated"; exit 1; }
          make -j"$(nproc)" $MAKE_FLAGS drivers/kernelsu/ 2>&1 | tee -a "$OUT/prebuild.log"; test "${PIPESTATUS[0]}" -eq 0
          grep -q '^int path_umount' fs/namespace.c || { echo "::error::path_umount not added to fs/namespace.c"; exit 1; }
          grep -q '^int path_umount' fs/internal.h || { echo "::error::path_umount not declared in fs/internal.h"; exit 1; }
          grep -q 'atomic_t filter_count;' include/linux/seccomp.h || { echo "::error::filter_count missing from seccomp.h"; exit 1; }
          git status --short fs include | head

      - name: Build Image
        working-directory: kernel
        run: make -k -j"$(nproc)" $MAKE_FLAGS Image 2>&1 | tee "$OUT/build.log"; test "${PIPESTATUS[0]}" -eq 0

      - name: Check KernelSU-Next is in the Image
        run: |
          grep -hE -- '-- KernelSU-Next' "$OUT/prebuild.log" "$OUT/build.log" | sort -u || true
          grep -q 'Hook mode: Syscall table patching' "$OUT/prebuild.log" "$OUT/build.log" \
            || { echo "::error::KernelSU-Next hook mode line not found in build log"; exit 1; }
          test -s "$OUT/arch/arm64/boot/Image"
          strings "$OUT/arch/arm64/boot/Image" | grep -m1 'Linux version'

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/modules ak3/patch ak3/ramdisk
          cp anykernel.sh ak3/anykernel.sh
          cp "$OUT/arch/arm64/boot/Image" ak3/Image
          KSU_VER=$(grep -hoE 'KernelSU-Next version: [0-9]+' "$OUT/prebuild.log" "$OUT/build.log" | head -1 | grep -oE '[0-9]+$' || echo unknown)
          ZIP="umi-${KERNEL_BRANCH}-KSUN-${KSU_VER}-$(date -u +%Y%m%d).zip"
          (cd ak3 && zip -r9 "../$ZIP" . -x '.*')
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          if-no-files-found: error

      - name: Upload config and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            out/.config
            out/prebuild.log
            out/build.log
          include-hidden-files: true
          if-no-files-found: ignore
